name: Docs checks

# No `paths:` filter, so the check reports on every pull request and can be
# required (see unit-tests.yml).
on:
  pull_request:
  push:
    branches: [main]
  # The merge queue's checks run on the merge group's commit.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: pip install -r .github/requirements-ci.txt

      - name: Run docs checks
        run: python .github/scripts/docs-checks.py
