name: Build DDI artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: this workflow executes PR-controlled build code
# (the Justfile and build scripts come from the PR head), so the workflow-wide
# token is read-only. contents: write is granted per job only where genuinely
# required (see track-refs and release below).
permissions:
  contents: read

jobs:
  # Resolves BuildStream junction refs and pushes them back to the PR branch.
  # This runs PR-controlled code (`just bst source track`) with a write token,
  # so it keeps the pre-existing renovate/* branch gate. The push updates the
  # PR branch tip; the build job below runs afterwards and checks out that
  # updated tip.
  track-refs:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # pushes resolved refs back to the renovate/* PR branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up just
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2
        with:
          tool: just

      - name: Track and Resolve BuildStream Refs
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          just bst source track freedesktop-sdk.bst || true
          just bst source track gnome-build-meta.bst || true
          if ! git diff --exit-code; then
            git add elements/
            git commit -m "chore: resolve BuildStream junction refs to git-describe format" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push origin "HEAD:${HEAD_REF}"
          fi

  build:
    # Read-only token (workflow default): on pull_request this job checks out
    # and executes PR-controlled code, so it must never hold a write token.
    needs: track-refs
    # track-refs is skipped for non-renovate PRs and pushes; only a failed or
    # cancelled track job should stop the build.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Set up just
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2
        with:
          tool: just

      - name: Validate Element Graph
        run: just validate

      - name: Set up runner disk space
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/podman /mnt/buildstream
          sudo chown -R "$USER:$USER" /mnt/podman /mnt/buildstream
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/storage.conf <<EOF
          [storage]
          driver = "overlay"
          runroot = "/run/user/1001"
          graphroot = "/mnt/podman"
          EOF
          mkdir -p ~/.cache
          ln -sf /mnt/buildstream ~/.cache/buildstream

      - name: Build and export DDI OS image
        run: |
          just build-ddi
          just export-ddi

      - name: Build and export live installer & target UKI, and PXE boot inputs
        run: |
          just build-installer
          just export-pxe

      - name: Build and export k0s systemd-sysext
        run: |
          just build-sysext
          just export-sysext


      - name: Build and export Flatcar LTS Kernel & ZFS
        run: |
          just build-kernel
          just build-zfs
          just export-kernel
      - name: Sign release SHA256SUMS manifest
        if: github.ref == 'refs/heads/main'
        env:
          SYSUPDATE_SIGNING_KEY: ${{ secrets.SYSUPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          # systemd-sysupdate fetches <Path>/SHA256SUMS as the version
          # manifest, so all release assets must share one combined,
          # flat manifest at the release root.
          mkdir -p dist/release
          cp dist/bluefin-server-installer-*.raw.zst dist/bluefin-server-*.efi dist/release/
          cp dist/bluefin-server-pxe-vmlinuz-* dist/bluefin-server-pxe-initrd-*.cpio.gz dist/release/
          cp dist/ddi/bluefin-server-ddi-*.raw.zst dist/release/
          if [ -d dist/kernel ]; then
            cp dist/kernel/usr/lib/sysexts/*.raw dist/release/ 2>/dev/null || true
          fi
          (cd dist/release && sha256sum --binary -- * > SHA256SUMS)
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          echo "$SYSUPDATE_SIGNING_KEY" | gpg --batch --import
          gpg --batch --yes --detach-sign --armor -o dist/release/SHA256SUMS.gpg dist/release/SHA256SUMS

      - name: Resolve release version
        if: github.ref == 'refs/heads/main'
        id: version
        run: echo "version=$(just version)" >> "$GITHUB_OUTPUT"

      # Hand the signed assets to the release job below; the build job itself
      # stays read-only, so it cannot publish the release.
      - name: Upload release assets artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: dist/release/
          if-no-files-found: error
          retention-days: 1

  # Publishes the signed assets to the GitHub Release. Only runs on
  # pushes/dispatches to main, where the code is already reviewed, and is the
  # only job besides track-refs that holds contents: write.
  release:
    if: ${{ !failure() && !cancelled() && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # creates the GitHub Release and uploads its assets
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets
          path: dist/release

      - name: Upload assets to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          V="${{ needs.build.outputs.version }}"
          TAG="installer-v${V}"
          echo "Uploading release assets for tag: ${TAG}"
          gh release create "${TAG}" --title "Bluefin Server v${V}" --notes "Automated release triggered by Renovate dependency update on main" --prerelease=false || true
          gh release upload "${TAG}" \
            dist/release/* \
            --clobber
