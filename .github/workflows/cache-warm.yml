name: Warm BuildStream cache

on:
  push:
    branches: [main]
  workflow_dispatch:

# A seed must not occupy build.yml's serialized release queue.
# Finish the current warming run; GitHub keeps only the latest pending one.
concurrency:
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  kernel-cache:
    if: github.ref == 'refs/heads/main'
    # CASD_CLIENT_KEY lives in this environment, which only main may use.
    environment: bst-cache
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@1.59.0

      - name: Set up runner disk space
        run: bash scripts/ci-runner-disk.sh

      - name: Build and push the kernel cache unless it exists
        id: seed
        env:
          CASD_CLIENT_CERT: ${{ vars.CASD_CLIENT_CERT }}
          CASD_CLIENT_KEY: ${{ secrets.CASD_CLIENT_KEY }}
        run: bash scripts/kernel-cache.sh seed release

  kernel-cache-dev:
    if: github.ref == 'refs/heads/main'
    # CASD_CLIENT_KEY lives in this environment, which only main may use.
    environment: bst-cache
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: just@1.59.0

      - name: Set up runner disk space
        run: bash scripts/ci-runner-disk.sh

      - name: Build and push the dev kernel cache unless it exists
        id: seed
        env:
          CASD_CLIENT_CERT: ${{ vars.CASD_CLIENT_CERT }}
          CASD_CLIENT_KEY: ${{ secrets.CASD_CLIENT_KEY }}
        run: bash scripts/kernel-cache.sh seed dev

