name: Reproducibility

# Builds the image set, deletes the artifact of every project element it is
# made of (the final assembly and everything it is built from: the signed
# kernel modules and ZFS and NVIDIA modules, the Go helpers, the initrd, the
# sysext payloads, signed systemd-boot) from the local BuildStream cache,
# rebuilds them without pulling from any remote, and compares every output
# file except the GPG signatures, which embed their signing time. Both builds
# share one checkout, one set of throwaway keys and one image-version, so any
# difference comes from the elements themselves.
#
# Kept cached, so not compared: freedesktop-sdk's own elements (the kernel is
# most of a cold build, and they are built and checked upstream), and
# bluefin-server/keys/efi-keys.bst, because sbvarsign stamps the current time
# into each Secure Boot variable update it signs (PK/KEK/db.auth), the same
# way gpg timestamps SHA256SUMS.gpg, and has no option to fix it.
#
# A failed or cancelled scheduled run opens "Reproducibility check failing"
# (the status job below); a run that passes closes it.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility
  cancel-in-progress: false

jobs:
  reproducibility:
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    env:
      # The roots: everything oci/bluefin-server-image.bst stages into the
      # release set, and every oci/* target `just validate` resolves. The
      # rebuild deletes these and every project element they depend on;
      # tests/unit/test_reproducibility_workflow.py fails when a shipped element is missing.
      FINAL_ASSEMBLY: >-
        oci/bluefin-server-image.bst
        oci/bluefin-server-boot.bst
        oci/bluefin-server-usr.bst
        oci/bluefin-server-sbom.bst
        oci/k0s-sysext.bst
        oci/kubestellar-sysext.bst
        oci/kubeadm-sysext.bst
        oci/homelab-sysext.bst
        oci/argo-workflows-sysext.bst
        oci/mcp-sysext.bst
        oci/zfs-sysext.bst
        oci/nvidia-open-595-sysext.bst
        oci/nvidia-container-toolkit-sysext.bst
        bluefin-server/os-sd-boot-signed.bst
        homelab/homelab-templates.bst
        homebrew/seed.bst
        homebrew/templates.bst
        runtimes/podman-sysext.bst
        runtimes/docker-sysext.bst
        oci/nspawn-org-sysext.bst
        oci/tailscale-sysext.bst
        oci/netbird-sysext.bst
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up just
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: just@1.59.0

      - name: Set up runner disk space
        run: bash scripts/ci-runner-disk.sh

      # Throwaway keys and a 0.* version: nothing from this job is published.
      - name: Generate keys and set the image version
        run: |
          set -euo pipefail
          just gen-dev-keys
          just set-version "0.${GITHUB_RUN_NUMBER}"

      - name: First build
        run: |
          set -euo pipefail
          just build-image
          just bst artifact checkout oci/bluefin-server-image.bst --directory /src/dist/first
          (cd dist/first && find . -type f ! -name '*.gpg' -exec sha256sum {} + | sort -k2) > first.sha256
          rm -rf dist/first

      - name: Rebuild the final assembly and what it is built from
        run: |
          set -euo pipefail
          # Every project element in the closure of the roots; the junction's
          # elements (freedesktop-sdk.bst:...) and efi-keys stay cached (see
          # the header). bst colours its output even when piped.
          # shellcheck disable=SC2086
          just bst show --deps all --format '%{name}' ${FINAL_ASSEMBLY} \
            | sed 's/\x1b\[[0-9;]*m//g' \
            | grep -vE '^(freedesktop-sdk\.bst:|bluefin-server/keys/efi-keys\.bst$)' \
            | grep -E '^[a-z0-9-]+(/[a-z0-9-]+)*\.bst$' | sort -u > rebuild.txt
          # A listing that lost its elements would quietly compare nothing new.
          if [ "$(wc -l < rebuild.txt)" -lt 60 ] || ! grep -qx 'bluefin-server/kernel-modules.bst' rebuild.txt; then
            echo "::error::The element listing is incomplete ($(wc -l < rebuild.txt) elements)."
            exit 1
          fi
          echo "Rebuilding $(wc -l < rebuild.txt) project elements"
          # shellcheck disable=SC2046
          just bst artifact delete $(cat rebuild.txt)
          just bst build --ignore-project-artifact-remotes oci/bluefin-server-image.bst
          just bst artifact checkout oci/bluefin-server-image.bst --directory /src/dist/second
          (cd dist/second && find . -type f ! -name '*.gpg' -exec sha256sum {} + | sort -k2) > second.sha256

      - name: Compare
        run: |
          set -euo pipefail
          cat first.sha256
          if ! diff -u first.sha256 second.sha256; then
            echo "::error::The rebuilt image set differs from the first build (files listed above)."
            exit 1
          fi
          echo "Both builds produced identical files."

      - name: Upload both checksum lists
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reproducibility-checksums
          path: |
            first.sha256
            second.sha256
            rebuild.txt
          retention-days: 14

  # Nobody watches a weekly run: one open "Reproducibility check failing"
  # issue gets a comment per failed scheduled run and is closed by the next
  # one that passes. A cancelled run (the job's timeout) counts as a failure.
  # Dispatched runs do not touch it.
  status:
    needs: [reproducibility]
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Checkout the tracking-issue script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/tracking-issue.sh
          sparse-checkout-cone-mode: false

      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/tracking-issue.sh "Reproducibility check failing" "The weekly reproducibility check" "a later weekly run"
