name: Reproducibility

# Builds the image set, deletes the artifacts of the final assembly steps
# (images, UKIs, initrd, sysexts, signed systemd-boot) from the local
# BuildStream cache, rebuilds them without pulling from any remote, and
# compares every output file except the GPG signatures, which embed their
# signing time. Both builds share one checkout, one set of throwaway keys and
# one image-version, so any difference comes from the assembly itself.
#
# bluefin-server/keys/efi-keys.bst is kept: sbvarsign stamps the current time
# into each Secure Boot variable update it signs (PK/KEK/db.auth), the same
# way gpg timestamps SHA256SUMS.gpg, and has no option to fix it.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reproducibility
  cancel-in-progress: false

jobs:
  reproducibility:
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    env:
      FINAL_ASSEMBLY: >-
        oci/bluefin-server-image.bst
        oci/bluefin-server-boot.bst
        oci/bluefin-server-usr.bst
        oci/k0s-sysext.bst
        oci/kubestellar-sysext.bst
        oci/kubeadm-sysext.bst
        oci/homelab-sysext.bst
        oci/argo-workflows-sysext.bst
        oci/mcp-sysext.bst
        oci/zfs-sysext.bst
        bluefin-server/os-sd-boot-signed.bst
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up just
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2
        with:
          tool: just@1.58.0

      - name: Set up runner disk space
        run: |
          set -euo pipefail
          sudo mkdir -p /mnt/podman /mnt/buildstream
          sudo chown -R "$USER:$USER" /mnt/podman /mnt/buildstream
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/storage.conf <<EOF
          [storage]
          driver = "overlay"
          runroot = "/run/user/1001"
          graphroot = "/mnt/podman"
          EOF
          mkdir -p ~/.cache
          ln -sf /mnt/buildstream ~/.cache/buildstream

      # Throwaway keys and a 0.* version: nothing from this job is published.
      - name: Generate keys and set the image version
        run: |
          set -euo pipefail
          just gen-dev-keys
          just set-version "0.${GITHUB_RUN_NUMBER}"

      - name: First build
        run: |
          set -euo pipefail
          just build-image
          just bst artifact checkout oci/bluefin-server-image.bst --directory /src/dist/first
          (cd dist/first && find . -type f ! -name '*.gpg' -exec sha256sum {} + | sort -k2) > first.sha256
          rm -rf dist/first

      - name: Rebuild the final assembly
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          just bst artifact delete ${FINAL_ASSEMBLY}
          just bst build --ignore-project-artifact-remotes oci/bluefin-server-image.bst
          just bst artifact checkout oci/bluefin-server-image.bst --directory /src/dist/second
          (cd dist/second && find . -type f ! -name '*.gpg' -exec sha256sum {} + | sort -k2) > second.sha256

      - name: Compare
        run: |
          set -euo pipefail
          cat first.sha256
          if ! diff -u first.sha256 second.sha256; then
            echo "::error::The rebuilt image set differs from the first build (files listed above)."
            exit 1
          fi
          echo "Both builds produced identical files."
