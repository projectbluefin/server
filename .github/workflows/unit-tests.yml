name: Unit tests

# No `paths:` filter: a path-filtered workflow never reports on pull requests
# it skips, so it cannot be a required check. Both jobs take minutes.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bats nodejs shellcheck
          pip install -r .github/requirements-ci.txt

      # Ubuntu's AppArmor policy blocks unprivileged user namespaces; the
      # os-justfile bats tests run the k8s recipe inside one.
      - name: Allow unprivileged user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Set up just
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2
        with:
          tool: just@1.58.0

      - name: Run unit tests
        run: just test-unit
