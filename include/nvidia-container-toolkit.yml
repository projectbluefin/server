# Single source of truth for the NVIDIA Container Toolkit version axis.
#
# The toolkit sysext (oci/nvidia-container-toolkit-sysext.bst) ships
# nvidia-ctk, nvidia-cdi-hook and nvidia-container-runtime.cdi, which carry
# no kernel or driver ABI, so like k0s it is versioned on its own axis rather
# than on `image-version`.
# elements/nvidia/nvidia-container-toolkit.bst fetches the release tag with
# git and its `ref:` reads both atoms; .github/scripts/track-binaries.py moves
# them together.
variables:
  # NVIDIA/nvidia-container-toolkit release tag, without the leading "v".
  nvidia-container-toolkit-version: "1.20.2"
  # The commit that tag points to.
  nvidia-container-toolkit-commit: "adbd28c39b60f8eb7e03115b5ac61e58703f0ce7"
