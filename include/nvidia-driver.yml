# Shared recipe for the NVIDIA open-kernel-module driver flavours.
#
# A flavour's three elements each include this file, set
#
#   nvidia-flavour   nvidia-open-<branch>
#   nvidia-version   %{nvidia-open-<branch>-version} from include/nvidia.yml
#
# and run one of the command variables below:
#
#   nvidia-driver-build, nvidia-driver-install   elements/nvidia/<flavour>.bst
#   nvidia-sign                                  elements/nvidia/<flavour>-signed.bst
#   nvidia-sysext-stage                          elements/oci/<flavour>-sysext.bst
#
# Only kernel-open/ is built, never the closed kernel/ tree. NVIDIA's
# libraries, tools and firmware may only be redistributed unmodified, so they
# are installed byte-for-byte: strip-binaries is empty in every element and
# nothing rewrites them; NVIDIA's LICENSE ships with them.
variables:
  strip-binaries: ""

  # Headless userspace, by file name up to ".so": CUDA, NVML, NVENC/NVDEC,
  # optical flow, OpenCL, and the EGL/GLX/GLES vendor libraries behind the
  # EGL, GBM and Vulkan JSON files, for containers that ask for the graphics
  # capability. Not shipped: 32-bit libraries, the X driver, nvidia-settings,
  # libglvnd and the OpenCL ICD loader (containers bring their own), NGX,
  # OptiX, VDPAU, NvFBC, VulkanSC and nvidia-powerd.
  nvidia-libs: >-
    libcuda libnvidia-ml libnvidia-ptxjitcompiler libnvidia-nvvm
    libnvidia-nvvm70 libnvidia-gpucomp libnvidia-cfg libnvidia-opencl
    libnvcuvid libnvidia-encode libnvidia-opticalflow
    libEGL_nvidia libGLESv2_nvidia libGLESv1_CM_nvidia libnvidia-eglcore
    libnvidia-glsi libGLX_nvidia libnvidia-glcore libnvidia-tls
    libnvidia-glvkspirv libnvidia-egl-gbm libnvidia-allocator

  nvidia-tools: nvidia-smi nvidia-persistenced nvidia-modprobe nvidia-debugdump

  # A shipped ELF may need only NVIDIA libraries shipped here, glibc, or
  # these: X11, DRM and GBM are needed by the graphics vendor libraries
  # alone, which only load inside containers that bring them.
  nvidia-external-needed: >-
    libc.so.6 libm.so.6 libdl.so.2 libpthread.so.0 librt.so.1
    ld-linux-x86-64.so.2 libgcc_s.so.1
    libX11.so.6 libXext.so.6 libdrm.so.2 libgbm.so.1

  # The kernel modules built and shipped. nvidia-peermem is left out: it
  # serves GPUDirect RDMA over InfiniBand, which the FSDK kernel lacks.
  nvidia-modules: nvidia nvidia-uvm nvidia-modeset nvidia-drm

  nvidia-driver-build: |
    set -euo pipefail
    run="NVIDIA-Linux-x86_64-%{nvidia-version}.run"

    # The .run is a makeself archive: a shell prologue whose skip= line
    # names the line the zstd-compressed payload tarball starts on.
    skip="$(grep -a -m1 '^skip=' "${run}")"
    skip="${skip#skip=}"
    case "${skip}" in
      ''|*[!0-9]*) echo "ERROR: no makeself skip= line in ${run}" >&2; exit 1 ;;
    esac
    tail -n "+${skip}" "${run}" > payload.tar.zst
    magic="$(head -c 4 payload.tar.zst | od -An -tx1 | tr -d ' \n')"
    if [ "${magic}" != 28b52ffd ]; then
      echo "ERROR: the ${run} payload is not zstd (magic ${magic})" >&2
      exit 1
    fi
    mkdir payload
    zstd -dcq payload.tar.zst | tar -xf - -C payload --no-same-owner
    rm payload.tar.zst
    if [ "$(sed -n 2p payload/.manifest)" != "%{nvidia-version}" ]; then
      echo "ERROR: payload/.manifest is not for %{nvidia-version}" >&2
      exit 1
    fi

    kver="$(ls "%{indep-libdir}/modules")"
    if [ "$(echo "${kver}" | wc -w)" -ne 1 ]; then
      echo "ERROR: expected exactly one kernel in %{indep-libdir}/modules, found: ${kver}" >&2
      exit 1
    fi
    ksrc="%{prefix}/src/linux-${kver}"
    if [ ! -f "${ksrc}/Module.symvers" ]; then
      echo "ERROR: ${ksrc} is not a kernel build tree (no Module.symvers)" >&2
      exit 1
    fi
    make -C payload/kernel-open -j%{max-jobs} \
      SYSSRC="${ksrc}" SYSOUT="${ksrc}" KERNEL_UNAME="${kver}" \
      NV_KERNEL_MODULES="%{nvidia-modules}" modules

  nvidia-driver-install: |
    set -euo pipefail
    root="%{install-root}"
    kver="$(ls "%{indep-libdir}/modules")"
    ksrc="%{prefix}/src/linux-${kver}"

    # Unsigned and uncompressed; <flavour>-signed.bst signs and compresses.
    make -C payload/kernel-open -j1 \
      SYSSRC="${ksrc}" SYSOUT="${ksrc}" KERNEL_UNAME="${kver}" \
      NV_KERNEL_MODULES="%{nvidia-modules}" \
      INSTALL_MOD_PATH="${root}%{prefix}" INSTALL_MOD_DIR=extra/nvidia \
      INSTALL_MOD_STRIP=1 DEPMOD=true modules_install
    modroot="${root}%{indep-libdir}/modules/${kver}"
    find "${modroot}" -maxdepth 1 -type f -name 'modules.*' -delete
    for m in %{nvidia-modules}; do
      if [ ! -f "${modroot}/extra/nvidia/${m}.ko" ]; then
        echo "ERROR: ${m}.ko was not installed to ${modroot#${root}}/extra/nvidia" >&2
        exit 1
      fi
    done

    cd payload
    lib="${root}%{libdir}"
    install -d "${lib}"
    # .manifest rows: <name> <mode> <TYPE> <ARCH> [subdir/ or /] [target] MODULE:<tag>
    # Mode 0000 marks a symlink to <target>. Keep the 64-bit (NATIVE) rows of
    # the libraries named in nvidia-libs.
    awk -v libs="%{nvidia-libs}" '
      BEGIN { n = split(libs, l, " "); for (i = 1; i <= n; i++) want[l[i]] = 1 }
      NF >= 5 && $2 ~ /^[0-7]{4}$/ && $4 == "NATIVE" {
        stem = $1; sub(/\.so.*/, "", stem)
        if (!(stem in want) || $1 !~ /\.so/) next
        target = "-"
        for (i = 5; i <= NF; i++)
          if ($i !~ /^MODULE:/ && $i != "/" && $i !~ /\/$/) target = $i
        print ($2 == "0000" ? "L" : "F"), stem, $1, target
      }' .manifest > libs.list
    while read -r kind stem name target; do
      case "${name}${target}" in */*) echo "ERROR: unexpected subdirectory in .manifest row: ${name} ${target}" >&2; exit 1 ;; esac
      if [ "${kind}" = F ]; then
        install -m 0755 "${name}" "${lib}/${name}"
      else
        ln -s "${target}" "${lib}/${name}"
      fi
    done < libs.list
    for stem in %{nvidia-libs}; do
      if ! grep -q "^F ${stem} " libs.list; then
        echo "ERROR: .manifest has no NATIVE library ${stem}" >&2
        exit 1
      fi
    done
    # SONAME links the manifest does not declare (for example
    # libnvidia-egl-gbm.so.1); /usr is read-only at runtime, so ldconfig on
    # the node cannot create them.
    ldconfig -n "${lib}"
    # GBM loads its backend as <libdir>/gbm/<drm driver>_gbm.so.
    install -d "${lib}/gbm"
    ln -s ../libnvidia-allocator.so.1 "${lib}/gbm/nvidia-drm_gbm.so"

    for t in %{nvidia-tools}; do
      install -D -m 0755 "${t}" "${root}%{bindir}/${t}"
    done

    install -D -m 0644 10_nvidia.json "${root}%{datadir}/glvnd/egl_vendor.d/10_nvidia.json"
    install -D -m 0644 15_nvidia_gbm.json "${root}%{datadir}/egl/egl_external_platform.d/15_nvidia_gbm.json"
    install -D -m 0644 nvidia_icd.json "${root}%{datadir}/vulkan/icd.d/nvidia_icd.json"
    install -D -m 0644 nvidia.icd "${root}%{datadir}/OpenCL/vendors/nvidia.icd"

    fwdir="${root}%{indep-libdir}/firmware/nvidia/%{nvidia-version}"
    install -d "${fwdir}"
    awk '$3 == "FIRMWARE" { print $1 }' .manifest | while read -r fw; do
      install -m 0644 "${fw}" "${fwdir}/"
    done
    ls "${fwdir}"/gsp_*.bin > /dev/null

    install -D -m 0644 LICENSE "${root}%{datadir}/licenses/%{nvidia-flavour}/LICENSE"

    # Fail on a DT_NEEDED nothing provides, e.g. an NVIDIA library split out
    # in a later release, or a new dependency outside nvidia-external-needed.
    status=0
    for obj in "${lib}"/lib*.so.* "${root}%{bindir}"/*; do
      { [ -f "${obj}" ] && [ ! -L "${obj}" ]; } || continue
      for dep in $(objdump -p "${obj}" | awk '$1 == "NEEDED" { print $2 }'); do
        [ -e "${lib}/${dep}" ] && continue
        case " %{nvidia-external-needed} " in *" ${dep} "*) continue ;; esac
        echo "ERROR: ${obj##*/} needs ${dep}, which neither the sysext nor nvidia-external-needed provides" >&2
        status=1
      done
    done
    exit "${status}"

  nvidia-sign: |
    set -euo pipefail
    cp -a /nvidia-driver/. "%{install-root}/"
    openssl x509 -inform PEM -outform DER \
      -in /boot-keys/modules/linux-module-cert.crt -out module-cert.der
    find "%{install-root}%{indep-libdir}/modules" -type f -name '*.ko' \
      -exec sign-file sha512 /boot-keys/linux-module-cert.key module-cert.der {} ';' \
      -exec zstd -19 --rm -q {} ';'

    for kdir in "%{install-root}%{indep-libdir}"/modules/*/; do
      for m in %{nvidia-modules}; do
        ko="${kdir}extra/nvidia/${m}.ko.zst"
        if [ "$(modinfo -F sig_hashalgo "${ko}")" != sha512 ]; then
          echo "ERROR: ${ko#%{install-root}} is not signed with sha512" >&2
          exit 1
        fi
      done
    done

  nvidia-sysext-stage: |
    set -euo pipefail
    moddir="%{indep-libdir}/modules"
    kver="$(ls "/kernel-modules${moddir}")"
    if [ "$(echo "${kver}" | wc -w)" -ne 1 ]; then
      echo "ERROR: expected exactly one kernel in bluefin-server/kernel-modules.bst, found: ${kver}" >&2
      exit 1
    fi
    nv_kver="$(ls "/nvidia-driver${moddir}")"
    if [ "${nv_kver}" != "${kver}" ]; then
      echo "ERROR: NVIDIA modules were built for '${nv_kver}', the image kernel is '${kver}'" >&2
      exit 1
    fi

    mkdir -p sysext
    cp -a "/nvidia-driver%{prefix}" "sysext%{prefix}"

    # Only the modules under extra/nvidia/, no modules.* index: that would
    # hide the base image's and every other module sysext's. nvidia-load.service
    # loads them through the base image's bluefin-sysext-modules.
    modroot="sysext${moddir}/${kver}"
    if [ -n "$(find "sysext${moddir}" -name 'modules.*' -print -quit)" ] ||
       [ "$(ls -A "${modroot}")" != extra ] || [ "$(ls -A "${modroot}/extra")" != nvidia ]; then
      echo "ERROR: the sysext must ship only ${moddir}/${kver}/extra/nvidia" >&2
      exit 1
    fi

    src=sysext-src
    lib="sysext%{indep-libdir}"
    unitdir="${lib}/systemd/system"
    units="nvidia-flavour-guard.service nvidia-load.service nvidia-device-nodes.service nvidia-ldconfig.service nvidia-persistenced.service"
    for u in ${units}; do
      install -D -m 0644 "${src}/${u}" "${unitdir}/${u}"
    done
    install -D -m 0644 "${src}/modprobe-nvidia.conf" "${lib}/modprobe.d/nvidia.conf"
    install -D -m 0644 "${src}/sysusers-nvidia.conf" "${lib}/sysusers.d/nvidia.conf"
    install -D -m 0644 "${src}/tmpfiles-nvidia.conf" "${lib}/tmpfiles.d/nvidia.conf"

    # Presets are inert inside a sysext. bluefin-sysext-activate.service
    # re-requests multi-user.target after the boot-time merge, which starts
    # these; each unit skips itself on a node without an NVIDIA GPU.
    mkdir -p "${unitdir}/multi-user.target.wants"
    for u in ${units}; do
      ln -s "../${u}" "${unitdir}/multi-user.target.wants/${u}"
    done

    sed 's/@NVIDIA_FLAVOUR@/%{nvidia-flavour}/' "${src}/extension-release.nvidia" \
      > "${src}/extension-release.%{nvidia-flavour}"

    for entry in sysext/* sysext/.[!.]*; do
      [ -e "${entry}" ] || [ -L "${entry}" ] || continue
      [ "${entry}" = "sysext%{prefix}" ] || { echo "ERROR: sysext ships ${entry#sysext}" >&2; exit 1; }
    done
