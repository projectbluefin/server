# Single source of truth for the kubeadm sysext payload versions.
#
# Each version stays on the release series the target kubeadm cluster's nodes
# run, so a Bluefin Server worker matches them at the CRI/kubelet level.
# .github/workflows/track-binaries.yml proposes patch releases inside those
# series; moving to another series is manual (docs/skills/kubeadm-sysext.md).
# The sha256 of every download sits next to its source in
# elements/kubeadm/kubeadm-bin.bst; the sysext itself is locked to the image
# version (kubeadm_<image-version>.raw.zst).
#
# A comment line separates each version from the next, so the tracker's
# per-component pull requests never edit adjacent lines and merge in any order.
variables:
  # kubelet, kubeadm, kubectl (dl.k8s.io)
  kubernetes-version: "1.35.9"
  # crictl (cri-tools)
  crictl-version: "1.35.0"
  # containerd static build
  containerd-version: "2.1.5"
  # runc static build
  runc-version: "1.3.6"
  # containernetworking/plugins
  cni-plugins-version: "1.1.1"
  # CRI sandbox image (matches kubeadm-flags.env)
  pause-image: "registry.k8s.io/pause:3.10.1"
