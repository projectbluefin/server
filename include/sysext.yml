# Shared packing recipe for the oci/*-sysext.bst elements.
#
# An element stages its payload as a /usr tree under ./sysext, stages its
# static extension identity as sysext-src/extension-release.<sysext-name>,
# sets the variables below, and runs "%{sysext-pack}" as its last install
# command. The recipe stamps the extension-release file, packs ./sysext into
# an EROFS image, compresses the release asset and checksums it:
#
#   <sysext-image>.raw       uncompressed EROFS image
#   <sysext-image>.raw.zst   release asset
#   SHA256SUMS               sha256 of the .raw.zst
#
# Variables each element sets:
#   sysext-name          stem of the static identity file in sysext-src/
#   sysext-image         image file name without .raw
#   sysext-release       extension-release.d suffix: the name systemd-sysext
#                        merges the image under
#   sysext-version       VERSION_ID=
#   sysext-architecture  ARCHITECTURE= (%{systemd-arch}), or "" for a payload
#                        that runs on any architecture
variables:
  sysext-pack: |
    set -euo pipefail
    rel="sysext%{indep-libdir}/extension-release.d/extension-release.%{sysext-release}"
    install -D -m 0644 "sysext-src/extension-release.%{sysext-name}" "${rel}"
    echo "VERSION_ID=%{sysext-version}" >> "${rel}"
    if [ -n "%{sysext-architecture}" ]; then
      echo "ARCHITECTURE=%{sysext-architecture}" >> "${rel}"
    fi

    out="%{install-root}/%{sysext-image}.raw"
    # mkfs.erofs would pick a random filesystem UUID; derive it from the image
    # name instead so a rebuild of the same image is byte-identical.
    h="$(printf '%s' '%{sysext-image}' | sha256sum)"
    mkdir -p "%{install-root}"
    mkfs.erofs -d0 -U "${h:0:8}-${h:8:4}-${h:12:4}-${h:16:4}-${h:20:12}" "${out}" sysext
    zstd -T0 -19 -q "${out}" -o "${out}.zst"
    (cd "%{install-root}" && sha256sum --binary "%{sysext-image}.raw.zst" > SHA256SUMS)
