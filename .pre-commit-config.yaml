repos:
  - repo: local
    hooks:
      - id: docs-checks
        name: Documentation quality checks
        entry: python .github/scripts/docs-checks.py
        language: system
        pass_filenames: false
        files: ^(docs/|AGENTS\.md|README\.md|CONTRIBUTING\.md|\.github/scripts/docs-checks\.py)$
      - id: actionlint
        name: Lint GitHub Actions workflows
        entry: actionlint
        language: system
        files: ^\.github/workflows/.*\.(yml|yaml)$
      - id: check-release-version
        name: release-version matches pinned FSDK point release
        entry: python .github/scripts/check-release-version.py
        language: system
        pass_filenames: false
        files: ^(project\.conf|elements/freedesktop-sdk\.bst|\.github/scripts/check-release-version\.py)$
      - id: check-renovate-series
        name: Renovate version filters match the junction track series
        entry: python .github/scripts/check-renovate-series.py
        language: system
        pass_filenames: false
        files: ^(renovate\.json|elements/(freedesktop-sdk|gnome-build-meta)\.bst|\.github/scripts/check-renovate-series\.py)$
      - id: check-kubernetes-version
        name: Kubernetes version derived from include/kubernetes.yml, not restated
        entry: python .github/scripts/check-kubernetes-version.py
        language: system
        pass_filenames: false
        files: ^(include/kubernetes\.yml|elements/kubernetes/(kubernetes-bin|cni-plugins)\.bst|elements/oci/kubernetes-sysext\.bst|files/kubernetes/sysext/extension-release\.kubernetes|files/os/sysupdate\.kubernetes\.d/70-kubernetes\.transfer|\.github/scripts/check-kubernetes-version\.py)$
