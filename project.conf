name: bluefin-server

# Required BuildStream version
min-version: 2.5

# Subdirectory where elements are stored
element-path: elements

(@):
  - freedesktop-sdk.bst:include/runtime.yml
  - include/aliases.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - aarch64
      - x86_64
  # Transitional (projectbluefin/server#327): the netboot UKI's command line
  # carries systemd.set_credential=bluefin.ignition.allow-unsigned:1, so a
  # network-booted node applies an unsigned bluefin-node.ign (a 404 for
  # bluefin-node.ign.gpg). Set the default to False once Booty signs node
  # configs; the cut-over criteria are in docs/skills/booty-integration.md.
  # One build can override it: BST_FLAGS="-o ignition_allow_unsigned False".
  ignition_allow_unsigned:
    type: bool
    description: Netboot UKI accepts an unsigned bluefin-node.ign
    default: True
  # Groundwork for enrollment-free Secure Boot: the netboot and installer
  # ESPs boot shim (bluefin-server/shim.bst, the image DB certificate as its
  # vendor certificate) as EFI/BOOT/BOOT<ARCH>.EFI, with MokManager next to
  # it, and shim chain-loads the DB-signed systemd-boot. Off by default, so
  # the default build is unchanged. Until Microsoft signs this shim
  # (shim-review) it boots only where the Bluefin keys are enrolled; the
  # installed-disk layout is not wired yet (docs/skills/ddi-installer.md,
  # "Shim path"). One build can turn it on: BST_FLAGS="-o shim True".
  shim:
    type: bool
    description: ESPs boot shim, which chain-loads systemd-boot
    default: False

sandbox:
  build-arch: "%{arch}"

variables:
  # Installer axis (FSDK): must match the point release pinned in
  # elements/freedesktop-sdk.bst. Enforced by
  # .github/scripts/check-release-version.py.
  installer-version: "26.08.2"

# Pull-only: read from the shared GNOME + Bluefin BuildStream CAS caches.
artifacts:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

source-caches:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

plugins:
  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    elements:
      - collect_manifest
    sources:
      - git_repo
      - patch_queue
      - cargo2
  - origin: junction
    junction: freedesktop-sdk.bst
    elements:
      - collect_initial_scripts

sources:
  git_repo:
    config:
      ref-format: git-describe
