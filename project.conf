name: bluefin-server

# Required BuildStream version
min-version: 2.5

# Subdirectory where elements are stored
element-path: elements

(@):
  - freedesktop-sdk.bst:include/runtime.yml
  - include/aliases.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - aarch64
      - x86_64

sandbox:
  build-arch: "%{arch}"

variables:
  # Must match the FSDK point release pinned in elements/freedesktop-sdk.bst.
  # Renovate PRs re-sync this automatically (see build.yml "Track and Resolve");
  # `just check-version` fails the build if the two ever drift apart.
  release-version: "26.08.0"

plugins:
  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    sources:
      - git_repo
      - patch_queue
sources:
  git_repo:
    config:
      ref-format: git-describe
