name: bluefin-server

# Required BuildStream version
min-version: 2.5

# Subdirectory where elements are stored
element-path: elements

(@):
  - gnome-build-meta.bst:freedesktop-sdk.bst:include/runtime.yml
  - include/aliases.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - aarch64
      - x86_64

sandbox:
  build-arch: "%{arch}"

variables:
  # Installer axis (FSDK): must match the point release pinned in
  # elements/freedesktop-sdk.bst. Enforced by
  # .github/scripts/check-release-version.py.
  installer-version: "26.08.0"

  # OS payload axis (Flatcar): must match the Flatcar LTS release pinned in
  # include/flatcar.yml. Enforced by
  # .github/scripts/check-release-version.py.
  # flatcar-version is deliberately declared here as well as in include/flatcar.yml
  # because elements such as bluefin-server-ddi.bst do not include (@) include/flatcar.yml
  # and resolve flatcar-version from project.conf. The checker enforces they stay identical.
  flatcar-version: "4593.2.5"

# Pull-only: read from the shared GNOME + Bluefin BuildStream CAS caches.
artifacts:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

source-caches:
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

plugins:
  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    sources:
      - git_repo
      - patch_queue
      - cargo2
  - origin: junction
    junction: gnome-build-meta.bst
    elements:
      - collect_initial_scripts

sources:
  git_repo:
    config:
      ref-format: git-describe
