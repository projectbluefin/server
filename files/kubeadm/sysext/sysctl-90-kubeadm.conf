# Applied by containerd.service after br_netfilter is loaded.
net.ipv4.ip_forward = 1
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1
# Every pod's root processes share one per-user inotify budget; the kernel
# default of 128 instances runs out on a busy node and breaks anything new that
# needs one (systemd user managers log "Too many open files", e.g. under sudo).
fs.inotify.max_user_instances = 8192
fs.inotify.max_user_watches = 524288
