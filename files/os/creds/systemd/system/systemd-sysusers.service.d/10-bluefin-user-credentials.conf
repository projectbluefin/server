# Upstream imports the password credentials for root only. Import them for
# every user, so an account created from the sysusers.extra credential (for
# example the USB installer's developer-mode admin) can be given its password
# field too: sysusers applies passwd.hashed-password.<user> when it creates
# <user> (systemd-sysusers(8)). "*" there means no password login but, unlike
# sysusers' default "!*", not locked, which sshd without PAM requires for key
# logins.
[Service]
ImportCredential=passwd.hashed-password.*
ImportCredential=passwd.plaintext-password.*
