# Bluefin Server SSH policy: key-only authentication, fail closed.
# sshd.service is disabled by default. Before enabling it with
# `systemctl enable --now sshd.service`, provision an authorized key
# through an external mechanism; first-boot key provisioning is not
# implemented yet (see docs/MVP_1_0_READINESS.md).

PermitRootLogin prohibit-password
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
