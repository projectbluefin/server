# SSH configuration for Bluefin Server.
# Hardened defaults: no direct root password login, no password auth at all.
# Bring-up diagnostics stay available on the local console (root / bluefin,
# see the issue banner); for remote access inject an authorized_keys entry
# via the installer or systemd credentials. The seeded default password must
# never be usable over the network.

PermitRootLogin prohibit-password
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
