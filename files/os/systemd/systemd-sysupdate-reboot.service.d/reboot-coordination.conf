[Unit]
Description=Reboot coordination and lock inhibition for systemd-sysupdate
# Defer reboot if administrative or runtime lock files exist
ConditionPathExists=!/run/reboot-lock
ConditionPathExists=!/etc/reboot-lock

[Service]
# Gate reboot on Kubernetes liveness: if Kubernetes (k0s or kubelet) is active,
# defer reboot coordination to Kured rather than rebooting out of band.
# Note: This ExecCondition evaluates point-in-time liveness. On Kubernetes hosts
# undergoing service maintenance or restart, creating /run/reboot-lock provides
# deterministic inhibition regardless of temporary unit restart states.
ExecCondition=/usr/bin/sh -c '! systemctl is-active --quiet kubelet.service k0scontroller.service k0sworker.service'
