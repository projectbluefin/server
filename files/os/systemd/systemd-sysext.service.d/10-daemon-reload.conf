# A sysext merge makes unit files appear under /usr; it does not by itself make
# systemd notice them, and noticing them is still not the same as running them.
#
# The reload is necessary: without it, ordering edges on containerd.service and
# kubelet.service resolve against units systemd has never read.
#
# The explicit start is necessary too, and this is the subtle half. Flatcar's
# containerd sysext ships its own enablement symlink at
# /usr/lib/systemd/system/multi-user.target.wants/containerd.service. That
# symlink only becomes visible when the merge completes, which is *after*
# systemd has computed the boot transaction — and systemd does not retroactively
# pull newly-appeared .wants entries into a transaction already in flight. So
# whether containerd starts depends purely on whether the merge happened to land
# before multi-user.target was queued.
#
# That is a race, and it was observed resolving both ways on the same image:
#
#   boot A  merge 12:06:11.75, multi-user 12:06:13.14  -> containerd active
#   boot B  merge 12:21:10.24, multi-user not reached  -> containerd inactive,
#                                                         kubeadm-init blocked
#                                                         forever on the CRI
#                                                         socket
#
# Starting it here removes the race: the merge and the start are the same
# transaction, in order. `start` is idempotent — if the .wants symlink did win
# the race and containerd is already running, this is a no-op.
#
# --no-block so a slow containerd start cannot stall systemd-sysext.service and
# with it every unit ordered after the merge.
[Service]
ExecStartPost=/usr/bin/systemctl daemon-reload
ExecStartPost=/usr/bin/systemctl start --no-block containerd.service
