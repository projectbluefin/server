[Service]
# A diskless node runs from a RAM copy of the OS DDI with no ESP or XBOOTLDR
# mounted, so 20-uki.transfer (PathRelativeTo=boot) cannot resolve $BOOT and
# systemd-sysupdate refuses every verb for the host: sysupdated then has no
# host target and `updatectl features`/`enable` fail with "Invalid target:
# host". Diskless nodes never update their UKI (they reboot into a newer
# image), so mask that one transfer for this boot; the optional features stay
# listed and can be enabled for bluefin-sysext-fetch.
ExecStartPre=/usr/bin/sh -c 'if [ -e /run/machines/rootdisk.raw ]; then mkdir -p /run/sysupdate.d && ln -sfn /dev/null /run/sysupdate.d/20-uki.transfer; fi'
