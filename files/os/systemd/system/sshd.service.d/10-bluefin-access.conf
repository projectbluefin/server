[Unit]
Requires=bluefin-ssh-host-keys.service bluefin-core-access.service
After=bluefin-ssh-host-keys.service bluefin-core-access.service

[Service]
# Reset the inherited ExecStartPre= list. FSDK's sshd.service ships a single
# ExecStartPre=/usr/bin/ssh-keygen -A, and dropping it is intentional: host keys
# live in /var/lib/ssh and are generated by bluefin-ssh-host-keys.service, so
# ssh-keygen -A would only regenerate unused keys in /etc/ssh. The replacements
# below gate startup on the persistent host keys and then run a configuration
# syntax check with the same binary path FSDK's ExecStart= uses (/usr/bin/sshd).
ExecStartPre=
ExecStartPre=/usr/bin/test -s /var/lib/ssh/ssh_host_ed25519_key
ExecStartPre=/usr/bin/test -s /var/lib/ssh/ssh_host_rsa_key
ExecStartPre=/usr/bin/sshd -t
