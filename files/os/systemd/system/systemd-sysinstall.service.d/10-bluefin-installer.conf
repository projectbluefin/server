# Booted from the USB installer (bluefin-server-installer_<ver>.raw), the
# installer UKI starts system-install.target. The medium's ESP carries the
# disk UKI and the repart.d definitions with slot A's UUIDs pinned to this
# image's usrhash; the installer UKI names the disk UKI in
# BLUEFIN_INSTALL_KERNEL (systemd.setenv=).
#
# --erase=yes: the chosen disk is always erased (no keep/erase question); the
# summary and its "yes" confirmation stay as the one safety check.
# --reboot=no + SuccessAction=reboot: sysinstall's own reboot waits for a key
# press, so let the service manager reboot as soon as the install succeeds.
# Signed installer profiles select native repart definitions and the optional
# Core root-password prompt. Complete forwards only nonsecret profile intent.
[Unit]
RequiresMountsFor=/run/bluefin/installer
SuccessAction=reboot

[Service]
ExecStart=
ImportCredential=bluefin.server-profile
PassEnvironment=BLUEFIN_INSTALL_KERNEL BLUEFIN_INSTALL_REPART BLUEFIN_INSTALL_ROOT_PROMPT
ExecStart=systemd-sysinstall --variables=yes --erase=yes --reboot=no --mute-console=yes --definitions=${BLUEFIN_INSTALL_REPART} --kernel=${BLUEFIN_INSTALL_KERNEL} --load-credential=bluefin.server-profile:${CREDENTIALS_DIRECTORY}/bluefin.server-profile $BLUEFIN_INSTALL_ROOT_PROMPT
