[Unit]
# Operator hold: while either file exists the nightly reboot is skipped
# (a failed condition skips the unit, it does not fail it). /run/reboot-lock
# lasts until the next boot, /etc/reboot-lock until it is removed. The same
# files hold bluefin-boot-deadline.service. Kured has its own lock and does
# not read them. From projectbluefin/server#182 by Bob Killen.
ConditionPathExists=!/run/reboot-lock
ConditionPathExists=!/etc/reboot-lock

[Service]
# Only reboot into an update that has not already failed its boot tries;
# after a rollback systemd-sysupdate still reports that version as pending.
ExecCondition=/usr/libexec/bluefin-update-pending
# Kubernetes nodes reboot through kured (cordon, drain, one node at a time),
# which systemd-sysupdate.service.d/20-kured.conf triggers. While kubelet
# (kubeadm sysext) or k0s runs, the reboot timer stands down instead of
# rebooting the node under its workloads; a unit that is starting, stopping or
# restarting counts as running. A failed ExecCondition skips the unit rather
# than failing it. Interlock from projectbluefin/server#182.
ExecCondition=/usr/bin/sh -c 'for u in kubelet.service k0scontroller.service k0sworker.service; do s=$$(systemctl is-active "$$u"); case "$$s" in active|activating|deactivating|reloading|refreshing) echo "$$u is $$s: leaving the reboot to kured"; exit 1 ;; esac; done'
# Fleet reboot lock, last so a slot is taken only when the reboot would
# happen: with a FleetLock server configured (/etc/bluefin/reboot-lock.conf or
# the bluefin.reboot-lock.* credentials) the node reboots only while it holds
# a slot of its group, and bluefin-reboot-lock-release.service gives the slot
# back once the new boot is good. Without a server it passes. A refused slot
# (exit 1) and an unreachable server (exit 3) both skip the run: this node
# booted fine, so it can wait for a later one.
ImportCredential=bluefin.reboot-lock.*
ExecCondition=/usr/libexec/bluefin-reboot-lock acquire
