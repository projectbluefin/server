[Timer]
# FSDK's (upstream systemd's) timer runs the reboot once a night, at 04:10 plus
# a random delay of up to 30 minutes, so a fleet does not reboot in the same
# minute. With a fleet reboot lock (bluefin-reboot-lock) a node that finds every
# slot of its group taken skips that run; with one run a night a group would
# reboot one slot's worth of nodes per night. Two more runs in the window let
# the group take turns, since each node frees its slot once its new boot is
# good, usually within minutes. Without a FleetLock server, or with no newer
# version installed, the extra runs do nothing. The delay is set here as well
# because the window relies on it.
OnCalendar=04:40
OnCalendar=05:10
RandomizedDelaySec=30min
