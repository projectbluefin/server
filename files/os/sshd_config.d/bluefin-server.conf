# SSH configuration for Bluefin Server.
# Hardened defaults: key-only, no password auth at all. Root ships locked;
# provision an authorized key per node through Ignition or the
# ssh.authorized_keys.root credential (docs/skills/tpm2-credential-sealing.md).
# A console password set through a credential must never be usable over the
# network.

PermitRootLogin prohibit-password
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
# Without PAM, sshd refuses a locked account ("!" password) even for a key,
# and root stays locked when Ignition or the ssh.authorized_keys.root
# credential gives it only a key. With PAM, FSDK's /etc/pam.d/sshd account
# stack decides instead; it ignores the password field. The two lines above
# keep PAM out of authentication, so this opens no password path.
UsePAM yes

# Keep standard SSH file transfer available without another server process.
Subsystem sftp internal-sftp
