# Hand the hardware watchdog to PID 1 while the system runs, so a node whose
# kernel or service manager freezes resets itself instead of waiting for
# someone at the console. PID 1 pings /dev/watchdog0 at half this interval;
# a reboot keeps it armed for RebootWatchdogSec= (systemd's default, written
# here so the pair is visible). Without a watchdog device (most VMs) PID 1
# finds none and carries on. See docs/skills/diskless-troubleshooting.md.
[Manager]
RuntimeWatchdogSec=1min
RebootWatchdogSec=10min
