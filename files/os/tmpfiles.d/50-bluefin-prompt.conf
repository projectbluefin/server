# The Bluefin Server bash prompt (/usr/lib/bluefin/profile.d). A link, not a
# copy in the factory /etc, so installed nodes, which keep /etc across A/B
# updates, get it and its changes too. L leaves an operator's own file alone.
L /etc/profile.d/90-bluefin-prompt.sh - - - - ../../usr/lib/bluefin/profile.d/90-bluefin-prompt.sh
