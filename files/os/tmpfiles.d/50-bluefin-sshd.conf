# sshd's vendor drop-in (/usr/lib/bluefin/sshd_config.d, os-sshd-config.bst).
# A link, not a copy in the factory /etc, so installed nodes, which keep /etc
# across A/B updates, get its changes too. L leaves an operator's own file
# alone; bluefin-migrate-etc-vendor removes the unmodified copies older
# images left, before this runs.
L /etc/ssh/sshd_config.d/bluefin-server.conf - - - - ../../../usr/lib/bluefin/sshd_config.d/bluefin-server.conf
