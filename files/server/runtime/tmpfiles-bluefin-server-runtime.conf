# Defaults never overwrite existing host configuration or kubeadm state.
d /etc/containerd 0755 root root -
C /etc/containerd/config.toml - - - - /usr/share/bluefin-server/runtime/containerd/config.toml
d /etc/containerd/certs.d 0755 root root -
C /etc/crictl.yaml - - - - /usr/share/bluefin-server/runtime/crictl.yaml
d /etc/cni/net.d 0755 root root -
d /opt/cni/bin 0755 root root -
d /etc/kubernetes/manifests 0755 root root -
d /var/lib/kubelet/volumeplugins 0755 root root -
d /var/lib/bluefin/server/runtime/incoming 0700 root root -
