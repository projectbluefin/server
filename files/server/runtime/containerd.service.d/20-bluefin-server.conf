[Unit]
After=systemd-sysext.service
RequiresMountsFor=/var/lib/containerd

[Service]
# The unchanged Flatcar unit otherwise reads /usr/share/containerd/config.toml.
Environment=CONTAINERD_CONFIG=/etc/containerd/config.toml
# Boot-time tmpfiles/modules/sysctl may have run before this sysext was merged.
ExecStartPre=/usr/bin/systemd-tmpfiles --create bluefin-server-runtime.conf
ExecStartPre=/usr/bin/modprobe overlay
ExecStartPre=/usr/bin/modprobe br_netfilter
ExecStartPre=/usr/lib/systemd/systemd-sysctl 90-bluefin-server-runtime.conf
