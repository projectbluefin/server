[Unit]
Requires=containerd.service
After=containerd.service systemd-sysext.service
RequiresMountsFor=/var/lib/kubelet /etc/kubernetes

[Service]
# Keep kubeadm's standard kubeconfig/config environment from 10-kubeadm.conf.
# Do not repeatedly overwrite writable CNI plugins with Flatcar's cp pre-start.
ExecStartPre=
ExecStartPre=/usr/bin/systemd-tmpfiles --create bluefin-server-runtime.conf
Environment="KUBELET_BLUEFIN_ARGS=--volume-plugin-dir=/var/lib/kubelet/volumeplugins"
EnvironmentFile=
EnvironmentFile=-/var/lib/kubelet/kubeadm-flags.env
EnvironmentFile=-/etc/default/kubelet
ExecStart=
ExecStart=/usr/bin/kubelet $KUBELET_KUBECONFIG_ARGS $KUBELET_CONFIG_ARGS $KUBELET_BLUEFIN_ARGS $KUBELET_KUBEADM_ARGS $KUBELET_EXTRA_ARGS
