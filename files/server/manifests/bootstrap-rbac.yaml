  - deployments
  verbs:
  - update
  - patch
  resourceNames:
  - cilium-operator
- apiGroups: ['apps']
  resources: ['daemonsets','deployments']
  verbs: ['create']
- apiGroups: ['']
  resources: ['configmaps']
  verbs: ['create']
- apiGroups: ['networking.k8s.io']
