apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-application-controller
rules:
- apiGroups:
  - ''
  resources:
  - namespaces
  - nodes
  - persistentvolumes
  verbs: &id001
  - get
  - list
  - watch
- apiGroups:
  - storage.k8s.io
  resources:
  - storageclasses
  verbs: *id001
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs: *id001
- nonResourceURLs:
  - /api
  - /api/*
  - /apis
  - /apis/*
  - /version
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bluefin-baseline-controller
  namespace: kube-system
rules:
- apiGroups:
