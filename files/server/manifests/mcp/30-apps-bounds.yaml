apiVersion: v1
kind: ResourceQuota
metadata:
  name: bluefin-apps
  namespace: bluefin-apps
spec:
  hard:
    pods: '32'
    requests.cpu: '8'
    requests.memory: 8Gi
    limits.cpu: '16'
    limits.memory: 16Gi
    persistentvolumeclaims: '0'
    services.nodeports: '0'
    services.loadbalancers: '0'
    count/jobs.batch: '32'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: bluefin-apps
  namespace: bluefin-apps
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 256Mi
    defaultRequest:
      cpu: 50m
      memory: 64Mi
    max:
      cpu: '2'
      memory: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bluefin-apps
  namespace: bluefin-apps
spec:
  podSelector:
    matchLabels: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: bluefin-apps
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: bluefin-apps
