pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  server {
    listen 8080 ssl;
    server_name _;

    ssl_certificate /etc/kubestellar-kiosk/cert.pem;
    ssl_certificate_key /etc/kubestellar-kiosk/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Auto-redirect plain HTTP to HTTPS on the same port
    error_page 497 https://$http_host$request_uri;

    location = /kiosk-gate.js {
      alias /etc/kubestellar-kiosk/kiosk-gate.js;
      add_header Cache-Control "no-store";
    }

    location = /kiosk-gate.css {
      alias /etc/kubestellar-kiosk/kiosk-gate.css;
      add_header Cache-Control "no-store";
    }

    location / {
      proxy_pass http://kubestellar-console.kubestellar-console.svc.cluster.local:8080;
      proxy_redirect ~^https?://[^/]+/(.*) /$1;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Accept-Encoding "";
      proxy_set_header Connection "";
      sub_filter_once on;
      sub_filter '</head>' '<link rel="stylesheet" href="/kiosk-gate.css"></head>';
      sub_filter '</body>' '<script defer src="/kiosk-gate.js"></script></body>';
    }
  }
}
