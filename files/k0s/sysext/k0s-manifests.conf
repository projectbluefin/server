# Seed Bluefin k0s declarative stacks into /var/lib/k0s/manifests/
d /var/lib/k0s/manifests 0755 root root - -
C+ /var/lib/k0s/manifests/argocd - - - - /usr/share/k0s/manifests/argocd
C+ /var/lib/k0s/manifests/kubestellar - - - - /usr/share/k0s/manifests/kubestellar
# Per-file, not whole-directory: k0s-kiosk-tls.service also writes
# cert.pem/key.pem into this directory, and they must survive every boot.
# A directory-level `C+` here would delete-then-recopy the whole tree from
# /usr/share/k0s/kiosk (which never contains cert.pem/key.pem), wiping the
# generated TLS material on every boot. Targeting each static asset file
# individually still propagates sysext upgrades to nginx.conf/kiosk-gate.*
# without touching anything else in the directory.
d /var/lib/k0s/kiosk 0755 root root - -
C+ /var/lib/k0s/kiosk/nginx.conf - - - - /usr/share/k0s/kiosk/nginx.conf
C+ /var/lib/k0s/kiosk/kiosk-gate.js - - - - /usr/share/k0s/kiosk/kiosk-gate.js
C+ /var/lib/k0s/kiosk/kiosk-gate.css - - - - /usr/share/k0s/kiosk/kiosk-gate.css
