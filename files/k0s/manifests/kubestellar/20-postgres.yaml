apiVersion: v1
kind: Service
metadata:
  name: postgres-postgresql
  namespace: kubeflex-system
  labels:
    app.kubernetes.io/name: postgresql
spec:
  type: ClusterIP
  ports:
  - name: tcp-postgresql
    port: 5432
    targetPort: postgresql
  selector:
    app.kubernetes.io/name: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-postgresql
  namespace: kubeflex-system
  labels:
    app.kubernetes.io/name: postgresql
spec:
  serviceName: postgres-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
    spec:
      containers:
      - name: postgresql
        image: docker.io/library/postgres:16-alpine
        env:
        - name: POSTGRESQL_USERNAME
          value: "postgres"
        # Superuser password lives in the kubeflex-postgres Secret (see
        # 15-kubeflex-postgres-secret.yaml, generated at first boot) so it is
        # never committed to git or exposed in the pod spec. See #98.
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kubeflex-postgres
              key: password
        - name: POSTGRESQL_DATABASE
          value: "postgres"
        ports:
        - name: postgresql
          containerPort: 5432
