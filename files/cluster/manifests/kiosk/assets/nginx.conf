# Kiosk proxy for the KubeStellar console.
#
# Terminates TLS with a cert-manager-issued certificate and injects the kc-agent
# gate into the console's HTML. Everything here is served from a ConfigMap and a
# Secret; nothing is read from the host filesystem.

pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # The container root filesystem is read-only, so every scratch path nginx
  # might touch has to land on the /tmp emptyDir.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server {
    listen 8080 ssl;
    server_name _;

    # Issued by the in-cluster CA and rotated by cert-manager. No key material
    # is baked into any image.
    ssl_certificate /etc/kubestellar-kiosk/tls/tls.crt;
    ssl_certificate_key /etc/kubestellar-kiosk/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Auto-redirect plain HTTP to HTTPS on the same port
    error_page 497 https://$http_host$request_uri;

    location = /kiosk-gate.js {
      alias /etc/kubestellar-kiosk/assets/kiosk-gate.js;
      add_header Cache-Control "no-store";
    }

    location = /kiosk-gate.css {
      alias /etc/kubestellar-kiosk/assets/kiosk-gate.css;
      add_header Cache-Control "no-store";
    }

    location / {
      # 10.96.0.10 is CoreDNS: the tenth address of serviceSubnet 10.96.0.0/12
      # in files/kubernetes/kubeadm.yaml, which kubeadm hands to the cluster DNS
      # Service. nginx resolves the upstream at request time (proxy_pass through
      # a variable), so it needs a literal resolver and cannot use
      # /etc/resolv.conf. Changing serviceSubnet must change this line too or
      # the kiosk proxies to nothing.
      resolver 10.96.0.10 valid=5s ipv6=off;
      set $upstream_endpoint http://kubestellar-console.kubestellar-console.svc.cluster.local:8080;
      proxy_pass $upstream_endpoint;
      proxy_redirect ~^https?://[^/]+/(.*) /$1;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Accept-Encoding "";
      proxy_set_header Connection "";
      sub_filter_once on;
      sub_filter '</head>' '<link rel="stylesheet" href="/kiosk-gate.css"></head>';
      sub_filter '</body>' '<script defer src="/kiosk-gate.js"></script></body>';
    }
  }
}
