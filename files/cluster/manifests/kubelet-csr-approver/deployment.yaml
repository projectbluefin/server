apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubelet-csr-approver
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kubelet-csr-approver
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  # Single-node appliance, so leader election buys nothing and a second replica
  # would stay Pending.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubelet-csr-approver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubelet-csr-approver
    spec:
      serviceAccountName: kubelet-csr-approver
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: kubelet-csr-approver
          image: ghcr.io/postfinance/kubelet-csr-approver@sha256:6469ef517d2b6d3cb108fce8a913483533a48b1cd78b5d4af307fa09e04a7818
          args:
            - -metrics-bind-address
            - ":8080"
            - -health-probe-bind-address
            - ":8081"
          env:
            # Strict by shape rather than by a hardcoded name: the appliance's
            # node name is whatever the operator sets as the hostname, but it is
            # always a single DNS label. Refusing dotted names refuses the
            # actual attack, which is a compromised kubelet asking for a serving
            # certificate for some external FQDN.
            - name: PROVIDER_REGEX
              value: ^[a-z0-9][a-z0-9-]{0,62}$
            # One DNS SAN, the node's own name. Upstream default, restated
            # because a silent bump to it would widen what gets approved.
            - name: ALLOWED_DNS_NAMES
              value: "1"
            # 30 days. Upstream's default is 367 days; bounding it hard means a
            # serving certificate issued to a node that is later removed stops
            # being useful in a month rather than a year.
            - name: MAX_EXPIRATION_SEC
              value: "2592000"
            # The appliance has no authoritative DNS for its own node name, so
            # the forward-lookup check would deny every CSR. The regex above and
            # the kubelet's own identity are what gate approval here.
            - name: BYPASS_DNS_RESOLUTION
              value: "true"
            # Refuse CSRs whose requester is not system:node:<name>.
            - name: IGNORE_NON_SYSTEM_NODE
              value: "false"
          ports:
            - name: metrics
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
