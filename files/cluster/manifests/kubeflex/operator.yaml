apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeflex-controller-manager
  namespace: kubeflex-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeflex-controller-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: ["tenancy.kflex.kubestellar.org"]
    resources: ["controlplanes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["tenancy.kflex.kubestellar.org"]
    resources: ["controlplanes/status", "controlplanes/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces", "services", "secrets", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeflex-controller-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeflex-controller-manager
subjects:
  - kind: ServiceAccount
    name: kubeflex-controller-manager
    namespace: kubeflex-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeflex-controller-manager
  namespace: kubeflex-system
  labels:
    app.kubernetes.io/name: kubeflex
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeflex
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeflex
    spec:
      serviceAccountName: kubeflex-controller-manager
      containers:
        - name: manager
          image: ghcr.io/kubestellar/kubeflex/manager@sha256:ca31299554fa4f4c2f917d4c141761978ede64048914895beaef80f82f6fd177
          command:
            - /ko-app/manager
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=127.0.0.1:8080
            - --leader-elect
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
