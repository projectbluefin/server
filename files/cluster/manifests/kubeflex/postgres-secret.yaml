# Mints the PostgreSQL superuser password inside the cluster, once.
#
# The password is never committed to git and never appears in a pod spec: this
# Job generates it on first sync and stores it in the kubeflex-postgres Secret,
# which the StatefulSet reads through secretKeyRef (projectbluefin/server#98).
# It replaces the first-boot host script that used to write a Secret manifest
# into the node's manifest directory, where it was readable by anyone with a
# root shell and invisible to the cluster's own RBAC.
#
# Idempotent by construction: if the Secret already exists the Job exits without
# touching it, so the initialised database stays reachable across reboots and
# across re-syncs. Replace=true lets a future change to this Job land at all —
# Job specs are immutable, so an in-place update would otherwise fail the sync.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeflex-postgres-secret
  namespace: kubeflex-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeflex-postgres-secret
  namespace: kubeflex-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kubeflex-postgres"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubeflex-postgres-secret
  namespace: kubeflex-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubeflex-postgres-secret
subjects:
  - kind: ServiceAccount
    name: kubeflex-postgres-secret
    namespace: kubeflex-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kubeflex-postgres-secret
  namespace: kubeflex-system
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeflex-postgres-secret
    spec:
      restartPolicy: OnFailure
      serviceAccountName: kubeflex-postgres-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate
          image: docker.io/alpine/kubectl@sha256:8413f8890d19aa03f63851654f642957e65ba59654b0c9357ddc6ec0b05b63a6
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if kubectl -n kubeflex-system get secret kubeflex-postgres >/dev/null 2>&1; then
                echo "kubeflex-postgres already exists; leaving the running database's password alone"
                exit 0
              fi
              password="$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32)"
              kubectl -n kubeflex-system create secret generic kubeflex-postgres \
                --from-literal=password="${password}"
              echo "kubeflex-postgres created"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
