# Mints the console's JWT signing key inside the cluster, once.
#
# This is what replaced the shipped Secret that carried
# `jwt-secret: default-jwt-secret-...`. That value was identical on every
# Bluefin Server ever installed, which made every console session forgeable by
# anyone who had read this repository. It does not come back: the key is
# generated here, on this machine, on first sync.
#
# Same idempotence contract as the PostgreSQL password: if the Secret exists the
# Job leaves it alone, so already-issued sessions survive a re-sync.
#
# GitHub OAuth credentials are deliberately absent. They are site-specific, and
# the console reads them with optional: true, so an operator who wants OAuth
# creates kubestellar-console-github-oauth themselves.
---
apiVersion: v1
kind: Namespace
metadata:
  name: kubestellar-console
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubestellar-console-auth
  namespace: kubestellar-console
  annotations:
    argocd.argoproj.io/sync-wave: "3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubestellar-console-auth
  namespace: kubestellar-console
  annotations:
    argocd.argoproj.io/sync-wave: "3"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["kubestellar-console-auth"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubestellar-console-auth
  namespace: kubestellar-console
  annotations:
    argocd.argoproj.io/sync-wave: "3"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubestellar-console-auth
subjects:
  - kind: ServiceAccount
    name: kubestellar-console-auth
    namespace: kubestellar-console
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kubestellar-console-auth
  namespace: kubestellar-console
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 20
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubestellar-console-auth
    spec:
      restartPolicy: OnFailure
      serviceAccountName: kubestellar-console-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate
          image: docker.io/alpine/kubectl@sha256:8413f8890d19aa03f63851654f642957e65ba59654b0c9357ddc6ec0b05b63a6
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if kubectl -n kubestellar-console get secret kubestellar-console-auth >/dev/null 2>&1; then
                echo "kubestellar-console-auth already exists; existing sessions stay valid"
                exit 0
              fi
              jwt="$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 64)"
              kubectl -n kubestellar-console create secret generic kubestellar-console-auth \
                --from-literal=jwt-secret="${jwt}"
              echo "kubestellar-console-auth created"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
