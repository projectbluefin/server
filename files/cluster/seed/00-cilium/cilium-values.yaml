# Helm values used to render cilium.yaml. Reproduce the rendered manifest with:
#
#   curl -LO https://helm.cilium.io/cilium-1.20.2.tgz
#   echo "b2afd87b7f75f875f92a14559f14f59b7babbb479d968e3fd625a20bf30ec20e  cilium-1.20.2.tgz" | sha256sum -c
#   helm template cilium ./cilium-1.20.2.tgz \
#     --namespace kube-system --include-crds --values cilium-values.yaml > cilium.yaml
#
# Helm is a build-time tool only. Nothing in this repository ships or runs Helm
# on the appliance; the seed is plain YAML applied with `kubectl apply -k`.

# kube-proxy replacement. kubeadm runs with --skip-phases=addon/kube-proxy, so
# Cilium is the only thing implementing Service load balancing. This also turns
# on Cilium's hostPort support, which the kiosk proxy relies on.
kubeProxyReplacement: "true"

# Every Cilium workload below is hostNetwork, and Bluefin Server is a
# single-node appliance whose kube-apiserver listens on the same host. Pointing
# at the loopback endpoint removes the chicken-and-egg of reaching the
# kubernetes Service before Service load balancing exists.
#
# The chart's `k8sServiceHost: auto` is not usable here: it resolves the
# cluster-info ConfigMap through Helm's `lookup`, which returns nothing during
# `helm template` and fails the render.
k8sServiceHost: "localhost"
k8sServicePort: "6443"

# Single control-plane node; the chart default of 2 would leave one operator
# replica Pending forever.
operator:
  replicas: 1

# Must agree with networking.podSubnet in /usr/share/bluefin/kubeadm.yaml.
ipam:
  operator:
    clusterPoolIPv4PodCIDRList:
      - "10.244.0.0/16"

# Hubble's TLS material is generated by Helm at render time, which would bake
# private keys into the shipped image. No certificate or key material ships in
# any Bluefin Server image, so Hubble stays off.
hubble:
  enabled: false
