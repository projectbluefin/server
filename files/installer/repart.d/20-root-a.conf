# Root partition — slot A
# systemd-repart copies the DDI payload block-for-block from the embedded
# installer data partition on the boot medium.
# The source is a raw filesystem image; repart copies it verbatim.
# SizeMaxBytes bounds root-a's elastic growth to a realistic OS-payload size.
# It must never be set to the full test/VM disk size: with GrowFileSystem=yes
# and an unbounded cap, root-a's growth can consume the leftover space that
# /var (the tail partition, see 30-var.conf) needs, so the second boot drops
# to emergency mode waiting on /dev/disk/by-partlabel/var (issue #161).
[Partition]
Type=root
Label=bluefin-server-root-a
CopyBlocks=/dev/disk/by-partlabel/bluefin-installer-data
SizeMinBytes=4G
SizeMaxBytes=8G
GrowFileSystem=yes
