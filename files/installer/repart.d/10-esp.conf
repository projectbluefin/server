# EFI-SYSTEM — ESP slot (PARTLABEL EFI-SYSTEM)
# Created empty by systemd-sysinstall; populated post-install by the installer
# script via: bootctl install --esp-path=<mounted-ESP> --root=<mounted-root>
# which copies systemd-boot and registers the OS UKI from the installed rootfs.
# Type=esp expands to the upstream ESP type GUID
# c12a7328-f81f-11d2-ba4b-00a0c93ec93b (Flatcar's EFI-SYSTEM slot).
[Partition]
Type=esp
Format=vfat
Label=EFI-SYSTEM
SizeMinBytes=500M
SizeMaxBytes=1G
