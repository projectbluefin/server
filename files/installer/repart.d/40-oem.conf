# OEM — provider/first-boot state partition.
# Required, not optional: Flatcar's stage 2 depends on
# dev-disk-by-label-OEM.device, so without it boot waits 90s and drops to an
# emergency shell (projectbluefin/server#134 boot proof). The dependency
# matches the filesystem LABEL, so Label=OEM also names the ext4 filesystem.
# Type GUID: Flatcar's OEM partition, 0fc63daf-8483-4772-8e79-3d69d8477de4,
# adopted verbatim by projectbluefin/server#134.
[Partition]
Type=0fc63daf-8483-4772-8e79-3d69d8477de4
Format=ext4
Label=OEM
SizeMinBytes=1024M
