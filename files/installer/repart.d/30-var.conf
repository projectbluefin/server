# /var partition — writable, persistent across updates
# NOTE: Do NOT set FactoryReset=yes here: systemd-sysinstall hardcodes
#   deferPartitionsFactoryReset=true, which causes the installer to skip
#   creating /var entirely.
# GrowFileSystem=yes: XFS grows to fill all remaining disk space after
#   the ESP and root-a partitions are placed.
[Partition]
Type=var
Label=var
Format=xfs
GrowFileSystem=yes
CopyFiles=/k0s.raw:/lib/k0s/k0s.raw
SizeMinBytes=4G
