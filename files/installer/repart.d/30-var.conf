# /var partition — writable, persistent across updates
# NOTE: Do NOT set FactoryReset=yes here: systemd-sysinstall hardcodes
#   deferPartitionsFactoryReset=true, which causes the installer to skip
#   creating /var entirely.
# GrowFileSystem=yes: XFS grows to fill all remaining disk space after
#   the ESP and root-a partitions are placed.
# CopyFiles seeds both sysexts straight into systemd-sysext's own scan
#   directory (/var/lib/extensions), so the first boot merges them without a
#   network fetch.
#
#   kubernetes.raw  — kubeadm, kubelet, kubectl and the CNI plugins.
#     systemd-sysupdate later replaces this file through the kubernetes.raw
#     CurrentSymlink in files/os/sysupdate.kubernetes.d/70-kubernetes.transfer.
#
#   containerd-flatcar.raw — Flatcar's containerd sysext (containerd, runc, ctr,
#     containerd-shim-runc-v2) and the containerd.service that
#     files/os/systemd/system/kubeadm-init.service hard-requires. FSDK 26.08
#     ships no containerd component, so this is the only provider. The image
#     carries its own multi-user.target.wants symlink, so the merge enables the
#     service; no preset of ours is involved. Pinned by
#     elements/flatcar/containerd-sysext.bst.
#
#     The filename keeps its upstream stem on purpose. systemd-sysext merges
#     <name>.raw only if the image carries extension-release.<name>; this image
#     ships extension-release.containerd-flatcar, so seeding it as
#     containerd.raw would make sysext look for extension-release.containerd and
#     refuse the extension at boot.
#
#     The image is repacked before it is seeded: elements/flatcar/containerd-sysext.bst
#     rewrites the extension-release to ID=_any and drops VERSION_ID, keeping the
#     Flatcar release only in SYSEXT_VERSION_ID. So the merge is *not* gated on our
#     os-release, and tests/unit/test_seeded_sysext_names.py asserts that decoupling.
#     Bumping flatcar-version in include/flatcar.yml therefore only requires
#     re-pinning the source ref of that element; it will not desynchronise the merge
#     on hosts already carrying the old image.
[Partition]
Type=var
Label=var
Format=xfs
GrowFileSystem=yes
CopyFiles=/kubernetes.raw:/lib/extensions/kubernetes.raw
CopyFiles=/containerd-flatcar.raw:/lib/extensions/containerd-flatcar.raw
SizeMinBytes=4G
