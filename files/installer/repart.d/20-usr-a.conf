# USR-A — read-only /usr slot A (verity lands with the /usr DDI ticket)
# Type GUID: Flatcar's usr partition, 5dfbf5f4-2848-4bac-aa5e-0d9a20b745a6,
# adopted verbatim by projectbluefin/server#134.
# systemd-repart copies the DDI payload block-for-block from the embedded
# installer data partition on the boot medium. The source is a raw filesystem
# image; repart copies it verbatim. The target boots with mount.usr=PARTLABEL=
# USR-A (fstype xfs, flags ro) so this slot is the system's /usr.
[Partition]
Type=5dfbf5f4-2848-4bac-aa5e-0d9a20b745a6
Label=USR-A
CopyBlocks=/dev/disk/by-partlabel/bluefin-installer-data
SizeMinBytes=4G
