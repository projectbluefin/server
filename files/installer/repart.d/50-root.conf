# ROOT — writable state partition (tail of the disk): /etc, /var, /home.
# Type GUID: Flatcar's root partition, 3884dd41-8582-4404-b9a8-e9b84f2df50e,
# adopted verbatim by projectbluefin/server#134. That GUID is not a
# Discoverable Partitions Specification type, so systemd-gpt-auto-generator
# cannot find it — the UKI cmdline carries root=PARTLABEL=ROOT explicitly
# (asserted by tests/unit/test_repart_layout.py).
# Format=ext4 matches Flatcar's ROOT filesystem; CopyFiles= requires a
# formatted filesystem. GrowFileSystem=yes marks the DPS grow flag.
# CopyFiles: the offline k0s sysext lands at /var/lib/k0s/k0s.raw (the path
# k0s-first-boot-fetch.service checks), and the target /etc seed is unpacked
# from /usr/lib/bluefin-server/etc-seed assembled by the installer element
# (the DDI payload is /usr-only: its /etc is not visible under the USR-A
# mount).
[Partition]
Type=3884dd41-8582-4404-b9a8-e9b84f2df50e
Format=ext4
Label=ROOT
CopyFiles=/k0s.raw:/var/lib/k0s/k0s.raw
CopyFiles=/usr/lib/bluefin-server/etc-seed:/etc
SizeMinBytes=4G
GrowFileSystem=yes
