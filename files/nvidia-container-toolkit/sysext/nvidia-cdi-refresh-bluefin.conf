# Bluefin Server drop-in for upstream's nvidia-cdi-refresh.service.
[Unit]
# Driver sysext units: the ld.so cache must list libnvidia-ml and the
# /dev/nvidia* nodes must exist before `nvidia-ctk cdi generate`. Ordering
# only, so this sysext stays inert without the driver sysext.
After=nvidia-ldconfig.service nvidia-device-nodes.service

[Service]
# Upstream's ExecCondition= looks for nvidia.ko in the base image's
# modules.dep, which never lists a sysext's modules (nvidia-load.service loads
# them through bluefin-sysext-modules), so it would skip the refresh on every
# node. Replace it: skip, rather than fail, on a node with the driver sysext
# but no NVIDIA display or 3D controller (PCI vendor 0x10de, class 0x03xxxx).
ExecCondition=
ExecCondition=/bin/sh -c 'for d in /sys/bus/pci/devices/*; do [ "$$(cat "$$d/vendor")" = 0x10de ] || continue; case "$$(cat "$$d/class")" in 0x03*) exit 0 ;; esac; done; exit 1'
