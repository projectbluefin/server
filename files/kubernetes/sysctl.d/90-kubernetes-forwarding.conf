# Kernel networking required by the Kubernetes control plane.
#
# kubeadm's preflight fails fatally without this:
#
#   [ERROR FileContent--proc-sys-net-ipv4-ip_forward]:
#   /proc/sys/net/ipv4/ip_forward contents are not set to 1
#
# FSDK's /usr/lib/sysctl.d ships 50-default.conf, 50-coredump.conf and
# 50-pid-max.conf, none of which enable forwarding, so the appliance booted with
# ip_forward=0 and `kubeadm init` could never run.
#
# Forwarding is not optional for a node: every pod-to-pod and pod-to-service
# path leaves the pod netns through the host stack. Cilium replaces kube-proxy
# here, which removes the iptables datapath but not the routing requirement.
net.ipv4.ip_forward = 1

# The v6 counterpart. The cluster is v4-only today (podSubnet 10.244.0.0/16,
# serviceSubnet 10.96.0.0/12 in files/kubernetes/kubeadm.yaml), so this changes
# nothing now; it is here so enabling dual-stack is a kubeadm.yaml edit rather
# than a second debugging session.
net.ipv6.conf.all.forwarding = 1
